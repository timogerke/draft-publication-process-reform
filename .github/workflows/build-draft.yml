name: CI

env: 
  DRAFT_NAME: draft-gerke-publication-process-reform

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Build Environment
      - name: Build Environment
        run: mkdir archive gh-pages

      # Runs a single command using the runners shell
      - name: Setup Python
        uses: actions/setup-python@v7
        with: 
          python-version: '>=3.12'

      # Runs a set of commands using the runners shell
      - name: Setup Python environment
        run: python -m pip install --upgrade pip xml2rfc weasyprint

      - name: Extract Revision
        run: |
          TMP=$(python -c "import xml.etree.ElementTree as ET; r = ET.parse('main.xml').getroot(); print(r.attrib['docName'])")
          REVISION=$(echo ${TMP} | sed -e "s/${DRAFT_NAME}-//g")
          echo "REVISION=${REVISION}" >> $GITHUB_ENV
          
      - name: Expand XML
        run: xml2rfc --expand --allow-local-file-access main.xml -o archive/${DRAFT_NAME}-${REVISION}.xml

      - name: Compile expanded XML
        run: xml2rfc --v3 --text --allow-local-file-access archive/${DRAFT_NAME}-${VERSION}.xml -o gh-pages/${DRAFT_NAME}-${VERSION}.txt

      - name: Commit and Push Changes to Repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-commit and push revision ${{env.DRAFT_NAME}}-${{env.REVISION}}"
          file_pattern: | 
            archive/ 
            gh-pages/

  
